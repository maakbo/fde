<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="680" viewBox="0 0 1140 680" style="color:#25231F"><title>リポジトリの時間方向比較</title><rect width="1140" height="680" fill="white"/><text x="50" y="50" font-family="'Noto Sans CJK JP',sans-serif" font-size="16" fill="#726D65" text-anchor="start">maakbo / repository timeline exploration</text><text x="50" y="95" font-family="'Noto Sans CJK JP',sans-serif" font-size="29" fill="#25231F" text-anchor="start">先の1点から、後の2点へ。</text><text x="50" y="132" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" fill="#726D65" text-anchor="start">時間の向きを揃え、後続の2点は同じ位置に揃えない。</text><text x="190" y="196" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" fill="#25231F" text-anchor="middle">現行 · 下から上</text><svg x="136" y="237" width="108" height="108" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3V15.7M7 14L15.1158 8.3189" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="190" y="382" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" fill="#25231F" text-anchor="middle">リポジトリ</text><text x="190" y="416" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" fill="#726D65" text-anchor="middle">時間の読み方が曖昧</text><svg x="174" y="466" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3V15.7M7 14L15.1158 8.3189" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="190" y="536" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" fill="#726D65" text-anchor="middle">実寸32px</text><text x="570" y="196" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" fill="#25231F" text-anchor="middle">候補A · 上から下</text><svg x="516" y="237" width="108" height="108" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M8.00000 7.10000L8.00000 16.20000M9.60838 6.44412L15.39162 12.35588"/><circle cx="8" cy="4.8" r="2.3"/><circle cx="8" cy="18.5" r="2.3"/><circle cx="17" cy="14" r="2.3"/></g></svg><text x="570" y="382" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" fill="#25231F" text-anchor="middle">リポジトリ</text><text x="570" y="416" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" fill="#726D65" text-anchor="middle">先の点が上。後続2点は別の高さ</text><svg x="554" y="466" width="32" height="32" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M8.00000 7.10000L8.00000 16.20000M9.60838 6.44412L15.39162 12.35588"/><circle cx="8" cy="4.8" r="2.3"/><circle cx="8" cy="18.5" r="2.3"/><circle cx="17" cy="14" r="2.3"/></g></svg><text x="570" y="536" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" fill="#726D65" text-anchor="middle">実寸32px</text><text x="950" y="196" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" fill="#25231F" text-anchor="middle">候補B · 左から右</text><svg x="896" y="237" width="108" height="108" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7.10000 12.00000L16.20000 12.00000M6.71068 10.71965L12.58932 6.78035"/><circle cx="4.8" cy="12" r="2.3"/><circle cx="18.5" cy="12" r="2.3"/><circle cx="14.5" cy="5.5" r="2.3"/></g></svg><text x="950" y="382" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" fill="#25231F" text-anchor="middle">リポジトリ</text><text x="950" y="416" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" fill="#726D65" text-anchor="middle">先の点が左。後続2点は別の横位置</text><svg x="934" y="466" width="32" height="32" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7.10000 12.00000L16.20000 12.00000M6.71068 10.71965L12.58932 6.78035"/><circle cx="4.8" cy="12" r="2.3"/><circle cx="18.5" cy="12" r="2.3"/><circle cx="14.5" cy="5.5" r="2.3"/></g></svg><text x="950" y="536" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" fill="#726D65" text-anchor="middle">実寸32px</text><text x="50" y="602" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" fill="#726D65" text-anchor="start">祖先の丸から2つの後続へ直線でつなぐ。幹の途中に見えない分岐点を置かない。</text><text x="50" y="638" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" fill="#726D65" text-anchor="start">時間順を助ける概略記号。実際のGitコミット時刻や間隔を表す図ではない。</text></svg>