<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" style="color:#25231F"><title>AIの目・線幅・端末の変更前後</title><rect width="1200" height="720" fill="white"/><text x="60" y="54" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="16" font-weight="400" text-anchor="start">maakbo / detail refinement</text><text x="60" y="99" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="30" font-weight="500" text-anchor="start">目を起こして、線と角をやわらかく。</text><text x="60" y="136" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">上：前の案 1.35　下：今回の案 1.15　下部に実寸を併記</text><text x="180" y="190" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="18" font-weight="400" text-anchor="middle">AI</text><svg x="140" y="218" width="80" height="80" viewBox="0 0 24 24"><g fill="none" stroke="#25231F" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect x="4.3" y="7.2" width="15.4" height="12.7" rx="1.1"/><path d="M12 7.2V3.5h2.5"/><path d="M8 13.6h1.5m5 0H16"/></g></svg><text x="180" y="330" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更前</text><svg x="140" y="380" width="80" height="80" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="4.3" y="7.2" width="15.4" height="12.7" rx="1.7" /><path d="M12 7.2V3.5h2.5" /><path d="M8.7 12.4v2.3m6.6-2.3v2.3" /></g></svg><text x="180" y="492" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更後</text><svg x="161.0" y="526" width="38" height="38" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="4.3" y="7.2" width="15.4" height="12.7" rx="1.7" /><path d="M12 7.2V3.5h2.5" /><path d="M8.7 12.4v2.3m6.6-2.3v2.3" /></g></svg><text x="180" y="592" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸38px</text><text x="460" y="190" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="18" font-weight="400" text-anchor="middle">PC</text><svg x="420" y="218" width="80" height="80" viewBox="0 0 24 24"><g fill="none" stroke="#25231F" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.8" width="14" height="11.2" rx=".6"/><path d="m5 16-2.6 3.2h19.2L19 16"/></g></svg><text x="460" y="330" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更前</text><svg x="420" y="380" width="80" height="80" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.3" width="16" height="10.4" rx=".95" /><path d="m4 15.7-1.5 2.9h19L20 15.7" /></g></svg><text x="460" y="492" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更後</text><svg x="444.0" y="526" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.3" width="16" height="10.4" rx=".95" /><path d="m4 15.7-1.5 2.9h19L20 15.7" /></g></svg><text x="460" y="592" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="740" y="190" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="18" font-weight="400" text-anchor="middle">スマホ</text><svg x="700" y="218" width="80" height="80" viewBox="0 0 24 24"><g fill="none" stroke="#25231F" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect x="6.4" y="2.8" width="11.2" height="18.4" rx="1.2"/><path d="M10.4 5.3h3.2"/></g></svg><text x="740" y="330" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更前</text><svg x="700" y="380" width="80" height="80" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="6.4" y="2.8" width="11.2" height="18.4" rx="2" /><path d="M10.4 5.3h3.2" /></g></svg><text x="740" y="492" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更後</text><svg x="724.0" y="526" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="6.4" y="2.8" width="11.2" height="18.4" rx="2" /><path d="M10.4 5.3h3.2" /></g></svg><text x="740" y="592" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="1020" y="190" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="18" font-weight="400" text-anchor="middle">タブレット</text><svg x="980" y="218" width="80" height="80" viewBox="0 0 24 24"><g fill="none" stroke="#25231F" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="2.8" width="17" height="18.4" rx="1.2"/></g></svg><text x="1020" y="330" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更前</text><svg x="980" y="380" width="80" height="80" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="2.3" width="14.8" height="19.4" rx="1.7" /></g></svg><text x="1020" y="492" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">変更後</text><svg x="1004.0" y="526" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="2.3" width="14.8" height="19.4" rx="1.7" /></g></svg><text x="1020" y="592" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="60" y="643" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">AIは横棒から縦の目に。端末は角丸と縦横比を調整し、ロゴや細部は加えない。</text><text x="60" y="682" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">全12種類の線幅を1.15に統一。1.35より約15%細く。</text></svg>