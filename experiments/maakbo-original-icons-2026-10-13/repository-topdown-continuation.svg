<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" style="color:#25231F"><title>上から下の中間配置と前後の継続線比較</title><rect width="1100" height="610" fill="white"/><text x="50" y="50" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="16" font-weight="400" text-anchor="start">maakbo / top-down continuation review</text><text x="50" y="95" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="28" font-weight="500" text-anchor="start">上から下へ。右の丸は、中間の高さに。</text><text x="50" y="131" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">同じ3点の配置で、履歴が前後に続く短線を比べる。</text><text x="280" y="199" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" font-weight="400" text-anchor="middle">基本案 · 追加線なし</text><svg x="220" y="230" width="120" height="120" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7.1V16.2M9.83019 6.19298L15.16981 10.25702" /><circle cx="8" cy="4.8" r="2.3" /><circle cx="8" cy="18.5" r="2.3" /><circle cx="17" cy="11.65" r="2.3" /></g></svg><text x="280" y="385" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">リポジトリ</text><svg x="264" y="435" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7.1V16.2M9.83019 6.19298L15.16981 10.25702" /><circle cx="8" cy="4.8" r="2.3" /><circle cx="8" cy="18.5" r="2.3" /><circle cx="17" cy="11.65" r="2.3" /></g></svg><text x="280" y="505" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="820" y="199" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" font-weight="400" text-anchor="middle">比較案 · 前後に短い線</text><svg x="760" y="230" width="120" height="120" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7.1V16.2M9.83019 6.19298L15.16981 10.25702" /><circle cx="8" cy="4.8" r="2.3" /><circle cx="8" cy="18.5" r="2.3" /><circle cx="17" cy="11.65" r="2.3" /><path d="M8 1V2.5M8 20.8V22.3"/></g></svg><text x="820" y="385" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">リポジトリ</text><svg x="804" y="435" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7.1V16.2M9.83019 6.19298L15.16981 10.25702" /><circle cx="8" cy="4.8" r="2.3" /><circle cx="8" cy="18.5" r="2.3" /><circle cx="17" cy="11.65" r="2.3" /><path d="M8 1V2.5M8 20.8V22.3"/></g></svg><text x="820" y="505" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="50" y="568" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">右の丸は上4.80と下18.50の中間11.65。追加線は上下とも長さ1.50。</text></svg>