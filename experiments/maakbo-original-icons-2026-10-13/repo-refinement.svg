<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="650" viewBox="0 0 1140 650" style="color:#25231F"><title>リポジトリの丸と線の比較</title><rect width="1140" height="650" fill="white"/><text x="50" y="50" font-family="'Noto Sans CJK JP',sans-serif" font-size="16" fill="#726D65" text-anchor="start">maakbo / repository exploration</text><text x="50" y="95" font-family="'Noto Sans CJK JP',sans-serif" font-size="29" fill="#25231F" text-anchor="start">フォルダから、丸と線の記号へ。</text><text x="50" y="130" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" fill="#726D65" text-anchor="start">リポジトリの比較候補 · 線幅1.15 / 透明背景 / 実寸32px</text><text x="190" y="190" font-family="'Noto Sans CJK JP',sans-serif" font-size="19" fill="#25231F" text-anchor="middle">現行 · フォルダ</text><svg x="142" y="225" width="96" height="96" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 19.6Q3 19.6 3 18.8V5.7Q3 4.9 3.8 4.9H9Q9.4 4.9 9.65 5.25l1.5 2.1Q11.4 7.7 11.8 7.7h8.4q.8 0 .8.8v10.3q0 .8-.8.8Z" /><path d="M10 10.8v5.8m0-2.7 4-2.4v-1.6" /></g></svg><text x="190" y="360" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" fill="#25231F" text-anchor="middle">リポジトリ</text><text x="190" y="393" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" fill="#726D65" text-anchor="middle">置き場所としての意味が強い</text><svg x="174" y="445" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 19.6Q3 19.6 3 18.8V5.7Q3 4.9 3.8 4.9H9Q9.4 4.9 9.65 5.25l1.5 2.1Q11.4 7.7 11.8 7.7h8.4q.8 0 .8.8v10.3q0 .8-.8.8Z" /><path d="M10 10.8v5.8m0-2.7 4-2.4v-1.6" /></g></svg><text x="190" y="515" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" fill="#726D65" text-anchor="middle">実寸32px</text><text x="570" y="190" font-family="'Noto Sans CJK JP',sans-serif" font-size="19" fill="#25231F" text-anchor="middle">候補1 · 直線の履歴</text><svg x="522" y="225" width="96" height="96" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M6.9 12h2.2m5.8 0h2.2"/><circle cx="4" cy="12" r="2.9"/><circle cx="12" cy="12" r="2.9"/><circle cx="20" cy="12" r="2.9"/></g></svg><text x="570" y="360" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" fill="#25231F" text-anchor="middle">リポジトリ</text><text x="570" y="393" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" fill="#726D65" text-anchor="middle">3つの丸を、まっすぐつなぐ</text><svg x="554" y="445" width="32" height="32" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M6.9 12h2.2m5.8 0h2.2"/><circle cx="4" cy="12" r="2.9"/><circle cx="12" cy="12" r="2.9"/><circle cx="20" cy="12" r="2.9"/></g></svg><text x="570" y="515" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" fill="#726D65" text-anchor="middle">実寸32px</text><text x="950" y="190" font-family="'Noto Sans CJK JP',sans-serif" font-size="19" fill="#25231F" text-anchor="middle">候補2 · 枝分かれ</text><svg x="902" y="225" width="96" height="96" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.9v5.2m0-2.2c0-3 10-1.2 10-3"/><circle cx="7" cy="7" r="2.9"/><circle cx="7" cy="18" r="2.9"/><circle cx="17" cy="7" r="2.9"/></g></svg><text x="950" y="360" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" fill="#25231F" text-anchor="middle">リポジトリ</text><text x="950" y="393" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" fill="#726D65" text-anchor="middle">履歴と分岐を、丸と線で表す</text><svg x="934" y="445" width="32" height="32" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.9v5.2m0-2.2c0-3 10-1.2 10-3"/><circle cx="7" cy="7" r="2.9"/><circle cx="7" cy="18" r="2.9"/><circle cx="17" cy="7" r="2.9"/></g></svg><text x="950" y="515" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" fill="#726D65" text-anchor="middle">実寸32px</text><text x="50" y="577" font-family="'Noto Sans CJK JP',sans-serif" font-size="15" fill="#25231F" text-anchor="start">推奨は候補2。分岐が「履歴を持つリポジトリ」の手がかりになる。</text><text x="50" y="610" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" fill="#726D65" text-anchor="start">直線は手順や関係図にも見えるため、どちらも下ラベルとセットで使う。</text></svg>