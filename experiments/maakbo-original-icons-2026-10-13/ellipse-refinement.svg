<svg xmlns="http://www.w3.org/2000/svg" width="800" height="475" viewBox="0 0 800 475" style="color:#25231F"><title>業務の楕円の変更前後</title><rect width="800" height="475" fill="white"/><text x="40" y="44" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="25" font-weight="500" text-anchor="start">業務の楕円 · ごく小さな調整</text><text x="40" y="79" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">横幅はそのまま、縦の丸みだけ少し増やす。</text><svg x="150" y="111" width="120" height="120" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.3" ry="5.55" fill="none" stroke="#25231F" stroke-width="1.15"/></svg><text x="210" y="269" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">変更前</text><text x="210" y="298" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">ry 5.55</text><svg x="195" y="333" width="30" height="30" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.3" ry="5.55" fill="none" stroke="#25231F" stroke-width="1.15"/></svg><text x="210" y="390" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸30px</text><svg x="530" y="111" width="120" height="120" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.3" ry="6" fill="none" stroke="#25231F" stroke-width="1.15"/></svg><text x="590" y="269" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">変更後</text><text x="590" y="298" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="middle">ry 6.00</text><svg x="575" y="333" width="30" height="30" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.3" ry="6" fill="none" stroke="#25231F" stroke-width="1.15"/></svg><text x="590" y="390" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸30px</text><text x="40" y="440" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" text-anchor="start">実寸で高さは約1.13px増。大きな形の変更ではありません。</text></svg>