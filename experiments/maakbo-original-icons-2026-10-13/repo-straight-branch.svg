<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" style="color:#25231F"><title>リポジトリの曲線と直線の枝比較</title><rect width="1100" height="610" fill="white"/><text x="50" y="50" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="16" font-weight="400" text-anchor="start">maakbo / straight branch refinement</text><text x="50" y="95" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="29" font-weight="500" text-anchor="start">枝を曲げず、まっすぐつなぐ。</text><text x="50" y="131" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">丸3つの位置と大きさ・全体寸法・線幅は同じ。枝だけ変更。</text><text x="280" y="199" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" font-weight="400" text-anchor="middle">直前 · 曲線の枝</text><svg x="220" y="230" width="120" height="120" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3v6.4m0-2.8c0-3 10-1.8 10-3.6" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="280" y="385" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">リポジトリ</text><svg x="264" y="435" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3v6.4m0-2.8c0-3 10-1.8 10-3.6" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="280" y="505" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="820" y="199" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" font-weight="400" text-anchor="middle">今回 · 直線の枝</text><svg x="760" y="230" width="120" height="120" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3V15.7M7 14L15.1158 8.3189" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="820" y="385" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">リポジトリ</text><svg x="804" y="435" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3V15.7M7 14L15.1158 8.3189" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="820" y="505" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="50" y="568" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">縦の幹の途中から、右上の丸の左下の縁へ、斜めの直線を1本。</text></svg>