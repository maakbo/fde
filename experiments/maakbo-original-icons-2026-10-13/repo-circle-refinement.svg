<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" style="color:#25231F"><title>リポジトリの丸の縮小前後</title><rect width="1100" height="610" fill="white"/><text x="50" y="50" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="16" font-weight="400" text-anchor="start">maakbo / repository circle refinement</text><text x="50" y="95" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="29" font-weight="500" text-anchor="start">丸を小さく、枝を自然に。</text><text x="50" y="131" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">候補2を採用 · 丸の半径 2.90 → 2.30 / 線幅1.15は同じ</text><text x="280" y="199" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" font-weight="400" text-anchor="middle">縮小前</text><svg x="220" y="230" width="120" height="120" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.9v5.2m0-2.2c0-3 10-1.2 10-3" /><circle cx="7" cy="7" r="2.9" /><circle cx="7" cy="18" r="2.9" /><circle cx="17" cy="7" r="2.9" /></g></svg><text x="280" y="385" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">リポジトリ</text><svg x="264" y="435" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.9v5.2m0-2.2c0-3 10-1.2 10-3" /><circle cx="7" cy="7" r="2.9" /><circle cx="7" cy="18" r="2.9" /><circle cx="17" cy="7" r="2.9" /></g></svg><text x="280" y="505" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="820" y="199" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="20" font-weight="400" text-anchor="middle">今回の採用案</text><svg x="760" y="230" width="120" height="120" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3v6.4m0-2.8c0-3 10-1.8 10-3.6" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="820" y="385" fill="#25231F" font-family="'Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" text-anchor="middle">リポジトリ</text><svg x="804" y="435" width="32" height="32" viewBox="0 0 24 24"><g xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.3v6.4m0-2.8c0-3 10-1.8 10-3.6" /><circle cx="7" cy="7" r="2.3" /><circle cx="7" cy="18" r="2.3" /><circle cx="17" cy="7" r="2.3" /></g></svg><text x="820" y="505" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" text-anchor="middle">実寸32px</text><text x="50" y="568" fill="#726D65" font-family="'Noto Sans CJK JP',sans-serif" font-size="14" font-weight="400" text-anchor="start">丸を約21%小さく。縦線と枝は丸の縁に合わせ、丸の中に線を通さない。</text></svg>